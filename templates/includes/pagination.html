{% load query_transform %}
{% if is_paginated %}
  <ul class="pagination text-sm justify-content-center align-items-center">
    {% if page_obj.has_previous %}
      <li class="page-item">
        <a href="?{% query_transform request page=page_obj.previous_page_number %}" class="btn btn-outline-secondary btn-sm mb-0">
          Prev
        </a>
      </li>
    {% endif %}
    <li class="mx-2 text-sm text-secondary">
      <span class="btn btn-outline-secondary btn-sm mb-0 pe-none" style="text-transform: none;">
        Page {{ page_obj.number }} of {{ paginator.num_pages }}
      </span>
    </li>
    {% if page_obj.has_next %}
      <li class="page-item">
        <a href="?{% query_transform request page=page_obj.next_page_number %}" class="btn btn-outline-secondary btn-sm mb-0">
          Next
        </a>
      </li>
    {% endif %}
  </ul>
{% endif %}
