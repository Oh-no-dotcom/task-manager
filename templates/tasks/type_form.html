{% extends "layouts/base.html" %}

{% block content %}


  <div class="container-fluid py-4">

    <div class="row justify-content-center">
      <div class="col-lg-10">

        <div class="card">
          <div class="card-header pb-0">
            <h4>{{ object|yesno:"Update,Create" }} Type</h4>
          </div>

          <div class="card-body">
            <form method="post">
              {% csrf_token %}

              <div class="mb-3">
                <label>Name</label>
                {{ form.name }}
                {% if form.name.errors %}
                  <div class="text-danger small mt-1">
                    {{ form.name.errors }}
                  </div>
                {% endif %}
              </div>

              <button type="submit" class="btn bg-gradient-info">
                {{ object|yesno:"Update,Create" }}
              </button>
              <a href="javascript:history.back()" class="btn btn-dark">
                Cancel
              </a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

{% endblock %}
