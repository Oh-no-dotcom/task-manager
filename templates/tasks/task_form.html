{% extends "layouts/base.html" %}

{% block content %}


  <div class="container-fluid py-4">

    <div class="row justify-content-center">
      <div class="col-lg-10">

        <div class="card">
          <div class="card-header pb-0">
            <h4>{{ object|yesno:"Update,Create" }} Task</h4>
          </div>

          <div class="card-body">
            <form method="post">
              {% csrf_token %}

              <div class="mb-3">
                <label>Name</label>
                {{ form.name }}
              </div>

              <div class="mb-3">
                <label>Description</label>
                {{ form.description }}
              </div>

              <div class="mb-3">
                <label>Deadline</label>
                {{ form.deadline }}
              </div>

              <div class="mb-3">
                <label>Priority</label>
                {{ form.priority }}
              </div>

              <div class="mb-3">
                <label>Task Type</label>
                {{ form.task_type }}
              </div>

              <div class="mb-3">
                <label>Assignees</label>
                {{ form.assignees }}
              </div>

              <div class="form-check">
                {{ form.is_completed }}
                <label class="form-check-label">
                  Completed
                </label>
              </div>

              <button type="submit" class="btn bg-gradient-info">
                {{ object|yesno:"Update,Create" }}
              </button>
              <a href="javascript:history.back()" class="btn btn-dark">
                Cancel
              </a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

{% endblock %}
