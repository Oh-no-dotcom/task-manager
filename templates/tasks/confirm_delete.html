{% extends "layouts/base.html" %}

{% block content %}
  <h4>
    Delete {{ object }}
  </h4>
  <p>
    Are you sure you want to delete
    <strong>"{{ object }}"</strong>?
  </p>

  <form action="" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
      Delete
    </button>
    <a href="javascript:history.back()" class="btn btn-dark">
      Cancel
    </a>
  </form>
{% endblock %}
